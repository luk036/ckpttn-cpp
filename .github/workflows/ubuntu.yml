name: Ubuntu

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j4

      - name: Test
        run: ctest --test-dir build --output-on-failure

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure with coverage
        run: cmake -B build -DCKPTTN_ENABLE_COVERAGE=ON -DCKPTTN_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Collect code coverage
        run: |
          pip install gcovr
          gcovr --root . --xml --output coverage.xml --exclude test/ --exclude build/ --exclude standalone/ --exclude-unreachable-branches --exclude-throw-branches --gcov-ignore-parse-errors=negative_hits.warn --gcov-ignore-parse-errors=suspicious_hits.warn

      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          override_branch: ${{ github.event_name == 'push' && github.ref_name || '' }}
          files: coverage.xml
          fail_ci_if_error: false
